name: Update Github Stats Gist
on:
    workflow_dispatch:
    schedule:
        - cron: '0 */12 * * *'
    push:
        branches: master
jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npx -y github-stats-box@1
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }} # Do not edit, defined in secrets
                  GIST_ID: ${{ secrets.GIST_ID }} # Do not edit, defined in secrets. The ID portion from your gist url

                  # Edit the following environment variables
                  ALL_COMMITS: true # If `true` it will count all commits, if `false` it will count your last year commits
                  K_FORMAT: true # If `true`, large numbers will be formatted with a "k", for example "1.5k"

    # Prevent GitHub from disabling this scheduled workflow after 60 days of repo inactivity
    workflow-keepalive:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - uses: liskin/gh-workflow-keepalive@v1
